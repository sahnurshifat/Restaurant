<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Invoice — QR Restaurant</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Invoice-specific print-friendly layout */
    .invoice-wrapper {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.25rem;
    }
    .invoice-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .invoice-header .restaurant-name {
      font-size: 2rem;
    }
    .invoice-header p {
      color: var(--c-muted);
      font-size: .9rem;
    }
    .thank-you {
      text-align: center;
      margin-top: 2rem;
      color: var(--c-muted);
      font-size: .9rem;
    }
  </style>
</head>
<body>

  <!-- ── Header (hidden in print) ─────────────────── -->
  <header class="site-header">
    <span class="logo">🍽 Khana Pina</span>
    <a class="btn btn--ghost" href="index.html">← Back to Menu</a>
  </header>

  <!-- ── Invoice ────────────────────────────────────── -->
  <div class="invoice-wrapper">
    <div class="invoice-header">
      <h1 class="restaurant-name">Grabzo <br> Every bite matters</h1>
      <p>Pitha Ghor Goli, Jagannathpur, Bashundhara Road | +880 1749-586887</p>
      <p id="invoice-date"></p>
    </div>

    <!-- Populated by invoice.js -->
    <div id="invoice-container">
      <p class="empty-state">Loading invoice…</p>
    </div>

    <p class="thank-you">Thank you for dining with us! </p>
  </div>

  <!-- ── Scripts ────────────────────────────────────── -->
  <script type="module">
    // invoice.js auto-calls loadInvoice() on import
    import './js/invoice.js';

    // Stamp the invoice date
    document.getElementById('invoice-date').textContent =
      new Date().toLocaleString('en-BD', { dateStyle: 'long', timeStyle: 'short' });
  </script>

</body>
</html>
