<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — QR Restaurant</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <!-- Hide body immediately — shown only after auth check passes -->
  <style> body { visibility: hidden; } </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="site-header">
    <span class="logo">⚙️ Admin Panel</span>
    <button class="btn btn--secondary" id="logout-btn">Logout</button>
  </header>

  <div class="container mt-4">

    <!-- ── Tab Bar ──────────────────────────────────── -->
    <nav class="tab-bar">
      <button class="active" data-tab="orders">Live Orders</button>
      <button data-tab="menu">Manage Menu</button>
    </nav>

    <!-- ── Orders Tab ───────────────────────────────── -->
    <section id="tab-orders">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem;">
        <h2 style="margin:0;">Live Orders</h2>
        <span id="orders-refresh-stamp" style="font-size:.78rem; color:var(--c-muted);">Loading…</span>
      </div>
      <div id="orders-container">
        <p class="empty-state">Loading orders…</p>
      </div>
    </section>

    <!-- ── Menu Management Tab ──────────────────────── -->
    <section id="tab-menu" style="display:none;">
      <div style="display:flex; gap:2rem; flex-wrap:wrap;">

        <!-- Item Form -->
        <div style="flex:0 0 300px;">
          <h2 id="form-title">Add Item</h2>
          <form id="menu-item-form" class="mt-2">
            <div class="form-group">
              <label>Name</label>
              <input name="name" type="text" required />
            </div>
            <div class="form-group">
              <label>Category</label>
              <input name="category" type="text" placeholder="e.g. Starters" required />
            </div>
            <div class="form-group">
              <label>Price (৳)</label>
              <input name="price" type="number" step="0.01" min="0" required />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input name="image_url" type="url" />
            </div>
            <div class="form-group">
              <label>Available?</label>
              <select name="is_available">
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>
            <button class="btn" type="submit" style="width:100%;">Save Item</button>
          </form>
        </div>

        <!-- Item List -->
        <div style="flex:1; min-width:0;">
          <h2>Current Menu</h2>
          <div id="admin-menu-list" class="mt-2">
            <p class="empty-state">Loading…</p>
          </div>
        </div>

      </div>
    </section>

  </div><!-- /container -->

  <!-- ── Scripts ────────────────────────────────────── -->
  <script type="module">
    import { requireAuth, adminLogout } from '../js/adminAuth.js';

    // Auth check FIRST — page stays invisible until confirmed.
    // requireAuth() redirects to login.html if session missing.
    const session = await requireAuth();
    if (!session) {
      // requireAuth already redirected; stop execution.
      throw new Error('Unauthenticated');
    }

    // Auth confirmed — reveal the page
    document.body.style.visibility = 'visible';

    // Execute adminOrders.js — it self-initialises (no default export needed)
    await import('../js/adminOrders.js');
    let menuLoaded = false;

    // Tab switching
    document.querySelectorAll('.tab-bar button').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const tab = btn.dataset.tab;
        document.getElementById('tab-orders').style.display = tab === 'orders' ? '' : 'none';
        document.getElementById('tab-menu').style.display   = tab === 'menu'   ? '' : 'none';

        if (tab === 'menu' && !menuLoaded) {
          await import('../js/adminMenu.js');
          menuLoaded = true;
        }
      });
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', adminLogout);
  </script>

</body>
</html>
